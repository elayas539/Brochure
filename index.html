<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talleres de Formación Docente VRA</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add("en-marco")}catch(e){document.documentElement.classList.add("en-marco")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  color-scheme: light;
  --f-titulo:"Montserrat","Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-texto:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fondo:#F3F2F6;
  --superficie:#FFFFFF;
  --superficie-2:#F7F5F9;
  --tinta:#4D2C54;
  --texto:#1F1A24;
  --texto-2:#5E5766;
  --linea:#DDD8E3;
  --banda-a:#672A60;
  --banda-b:#4D2C54;
  --banda-texto:#FFFFFF;
  --banda-texto-2:#E6D9E8;
  --banda-celda:rgba(255,255,255,.09);
  --banda-linea:rgba(255,255,255,.24);
  --cta:#4D2C54;
  --cta-texto:#FFFFFF;
  --cta-hover:#672A60;
  --foco:#7A3FB8;
  --pronto:#F1E7F4;
  --ok:#1F6B2A;
  --aviso-fondo:#FFF5D6;
  --aviso-borde:#B8901A;
  --aviso-texto:#4A3A08;
  --sombra:0 18px 48px rgba(40,10,40,.28);
  --mezcla:18%;
  --oscurecer:#000;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --fondo:#141018;
    --superficie:#1D1822;
    --superficie-2:#241E2A;
    --tinta:#E9DDEE;
    --texto:#EEE8F1;
    --texto-2:#B4AABB;
    --linea:#372E3E;
    --banda-a:#3E1A3A;
    --banda-b:#2B1830;
    --banda-texto:#FFFFFF;
    --banda-texto-2:#D9CADD;
    --banda-celda:rgba(255,255,255,.07);
    --banda-linea:rgba(255,255,255,.18);
    --cta:#E9DDEE;
    --cta-texto:#1D1822;
    --cta-hover:#FFFFFF;
    --foco:#CDA8FF;
    --pronto:#3A2A41;
    --ok:#8FD49A;
    --aviso-fondo:#2A2412;
    --aviso-borde:#8F7623;
    --aviso-texto:#F2E3B3;
    --sombra:0 18px 48px rgba(0,0,0,.6);
    --mezcla:24%;
    --oscurecer:#FFFFFF;
  }
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
html.en-marco{height:100%;overflow:hidden}
html.en-marco body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--f-texto);font-size:1rem;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.contenedor{max-width:1160px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
svg.ic{width:16px;height:16px;flex:none}
h1,h2,h3{font-family:var(--f-titulo)}

/* Número de línea formativa (círculo como las insignias del brochure) */
.num-linea{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none;background:var(--c);color:var(--ct);
  font-family:var(--f-titulo);font-weight:800;font-size:.6875rem;line-height:1;box-shadow:0 0 0 1px rgba(0,0,0,.16)}
.linea-tag{margin:0;display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:700;color:var(--texto-2)}

/* Barra de prototipo (solo pruebas internas) */
.proto{background:var(--aviso-fondo);color:var(--aviso-texto);border-bottom:1px dashed var(--aviso-borde);font-size:.875rem}
.proto-inner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.proto strong{font-weight:800}
.proto label{display:inline-flex;align-items:center;gap:8px}
.proto input[type=checkbox]{accent-color:var(--aviso-borde);width:16px;height:16px}
.proto input[type=date]{padding:3px 8px;border:1px solid var(--aviso-borde);border-radius:6px;background:var(--superficie);color:var(--texto)}
.proto-rapidos{display:flex;flex-wrap:wrap;gap:6px}
.proto-rapidos button{border:1px solid var(--aviso-borde);background:transparent;color:var(--aviso-texto);border-radius:999px;padding:2px 11px;cursor:pointer}
.proto-rapidos button[aria-pressed="true"]{background:var(--aviso-borde);color:#fff}

/* Banda superior */
.banda{background:linear-gradient(100deg,var(--banda-a),var(--banda-b));color:var(--banda-texto);padding-block:clamp(28px,5vw,52px) clamp(24px,4vw,36px)}
.banda :focus-visible{outline-color:#fff}
.organiza{margin:0 0 14px;color:var(--banda-texto-2);font-size:.9375rem}
h1{margin:0;font-weight:800;font-size:clamp(2rem,4.6vw,3.25rem);line-height:1.06;letter-spacing:-.015em;max-width:20ch}
.periodo{margin:10px 0 0;font-family:var(--f-titulo);font-size:clamp(1.0625rem,2vw,1.35rem);font-weight:700}
.presentacion{margin:16px 0 0;max-width:72ch;color:var(--banda-texto)}
.cifras{margin:10px 0 0;max-width:72ch;color:var(--banda-texto-2)}

.tablero{margin:30px 0 0}
.tablero-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin:0 0 10px}
.tablero-cab h2{margin:0;font-size:1.0625rem;font-weight:700}
.tablero-cab p{margin:0;color:var(--banda-texto-2);font-size:.9375rem}
#estado-ciclo{color:var(--banda-texto)}
.tablero-scroll{overflow-x:auto;padding:4px 2px 8px;margin-inline:-2px}
.tabla-tablero{width:100%;min-width:700px;table-layout:fixed;border-collapse:separate;border-spacing:4px 5px}
.tabla-tablero col.col-etq{width:96px}
.tabla-tablero col.col-sep{width:10px}
.tabla-tablero th{padding:0;font-weight:400;font-size:.8125rem;color:var(--banda-texto-2)}
.tabla-tablero th.semana-cab{text-align:left;color:var(--banda-texto);font-family:var(--f-titulo);font-weight:700;padding:0 0 2px 2px;border-bottom:1px solid var(--banda-linea)}
.tabla-tablero th.dia-cab{text-align:center;line-height:1.15;padding-top:4px}
.tabla-tablero th.dia-cab span{display:block}
.tabla-tablero th.dia-cab .num{color:var(--banda-texto);font-size:.9375rem;font-weight:700;margin:1px auto 0;width:max-content;padding:0 6px;border-radius:999px}
.tabla-tablero th.dia-cab.hoy span:first-child{color:var(--banda-texto);font-weight:700}
.tabla-tablero th.dia-cab.hoy .num{background:var(--banda-texto);color:var(--banda-b)}
.tabla-tablero th.dia-cab.feriado span:first-child{color:var(--banda-texto);font-style:italic}
.tabla-tablero th.dia-cab.pasado span{opacity:.5}
.tabla-tablero th.franja{text-align:left;color:var(--banda-texto);font-size:.875rem;line-height:1.1}
.tabla-tablero th.franja small{display:block;color:var(--banda-texto-2);font-size:.75rem}
.tabla-tablero td{padding:0}
.celda{height:30px;border-radius:6px;background:var(--banda-celda);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.celda.feriado{background:rgba(255,255,255,.9)}
td.hoy .celda{outline:1.5px solid rgba(255,255,255,.7);outline-offset:1px}
.ficha{flex:1;min-height:0;border:0;padding:0;border-radius:6px;background:var(--eje);color:var(--eje-t);cursor:pointer;
  font-family:var(--f-titulo);font-weight:800;font-size:.75rem;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.ficha:hover{filter:brightness(1.1)}
.ficha:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ficha.apagada{opacity:.16}
.marco{margin:14px 0 0;font-size:.875rem;color:var(--banda-texto-2);max-width:80ch}
.leyenda{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.8125rem;color:var(--banda-texto)}
.leyenda li{display:inline-flex;align-items:center;gap:7px}
.leyenda .num-linea{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.leyenda i{width:16px;height:16px;border-radius:5px;flex:none}
.leyenda .clave-feriado i{background:rgba(255,255,255,.9)}
.leyenda .clave-vacia i{background:var(--banda-celda);box-shadow:inset 0 0 0 1px var(--banda-linea)}
.leyenda .clave-otros{color:var(--banda-texto-2)}
.pista-scroll{display:none;margin:4px 0 0;font-size:.8125rem;color:var(--banda-texto-2)}

.tip{position:fixed;z-index:60;max-width:300px;display:flex;flex-direction:column;gap:3px;background:var(--superficie);color:var(--texto);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;font-size:.8125rem;line-height:1.35;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.tip b{font-weight:700}
.tip small{color:var(--texto-2)}

/* Antes de inscribirte */
.participar{padding-block:30px 4px}
.participar h2{margin:0 0 14px;font-size:1.25rem}
.participar-lista{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px 26px}
.participar-lista div{border-top:3px solid var(--tinta);padding-top:10px}
.participar-lista dt{font-family:var(--f-titulo);font-weight:700;font-size:.9375rem;margin-bottom:4px}
.participar-lista dd{margin:0;color:var(--texto-2);font-size:.9375rem}

/* Búsqueda y filtros */
.herramientas{padding-block:26px 6px;display:grid;gap:18px}
.fila-busqueda{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.buscador{flex:1 1 320px;max-width:560px;display:flex;flex-direction:column;gap:6px}
.buscador label{font-weight:700}
.campo{position:relative}
.campo svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--texto-2);pointer-events:none}
.campo input{width:100%;padding:10px 12px 10px 40px;border:1px solid var(--linea);border-radius:8px;background:var(--superficie);color:var(--texto)}
.campo input::placeholder{color:var(--texto-2)}
.btn.boton-filtros{display:none}
.grupos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 28px}
.grupo{border:0;margin:0;padding:0;min-width:0}
.grupo-linea{grid-column:1/-1}
.grupo legend{padding:0;margin:0 0 8px;font-weight:700;font-size:.9375rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;font-size:.875rem;line-height:1.3}
.chip:not(:has(.num-linea)){padding-left:12px}
.chip small{color:var(--texto-2);font-size:.75rem}
.chip .cuenta{min-width:1.4em;text-align:center;font-size:.75rem;font-weight:700;color:var(--texto-2);background:var(--superficie-2);border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--texto-2)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--superficie)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip[aria-pressed="true"] .cuenta{background:transparent;color:inherit}
.chip[aria-pressed="true"] .num-linea{box-shadow:0 0 0 1.5px var(--superficie)}
.chip:disabled{opacity:.45;cursor:default}
.chip:disabled:hover{border-color:var(--linea)}
.fila-estado{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;border-top:1px solid var(--linea);padding-top:14px}
#conteo{margin:0;font-weight:700}
.controles-estado{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.9375rem;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--tinta)}
.btn-texto{border:0;background:none;padding:4px 2px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.9375rem}

/* Pestañas */
.vistas{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin-top:22px;overflow-x:auto}
.vistas button{border:0;background:none;padding:12px 16px;font-weight:700;color:var(--texto-2);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.vistas button:hover{color:var(--texto)}
.vistas button[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--tinta)}
#panel{padding-block:26px 56px}

/* Elementos compartidos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:700;font-size:.9375rem;text-decoration:none;cursor:pointer;border:1px solid transparent;line-height:1.2;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primario{background:var(--cta);color:var(--cta-texto)}
.btn-primario:hover{background:var(--cta-hover)}
.btn-secundario{background:transparent;border-color:var(--linea);color:var(--texto)}
.btn-secundario:hover{border-color:var(--texto-2)}
.enlace-titulo{border:0;background:none;padding:0;margin:0;text-align:left;cursor:pointer;font-weight:700;color:var(--texto);line-height:inherit}
.enlace-titulo:hover{text-decoration:underline;text-underline-offset:3px}
.estado{margin:0;font-size:.8125rem;font-weight:700;display:flex;flex-direction:column;gap:2px}
.estado-pronto > span:first-child{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:var(--pronto);padding:2px 9px;border-radius:999px}
.estado-curso,.estado-realizado{color:var(--texto-2)}
.inscritos{font-weight:400;color:var(--texto-2);display:inline-flex;align-items:center;gap:5px}
.nota-estado{font-size:.8125rem;color:var(--texto-2)}
.vacio{background:var(--superficie);border:1px dashed var(--linea);border-radius:12px;padding:28px;max-width:640px}
.vacio-titulo{margin:0 0 6px;font-weight:700;font-size:1.0625rem}
.vacio p{margin:0 0 14px}

/* Vista por línea formativa */
.grupo-tema + .grupo-tema{margin-top:40px}
.grupo-tema h2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;font-size:1.25rem}
.grupo-tema h2 .num-linea{width:26px;height:26px;font-size:.8125rem}
.grupo-tema h2 span.cuantos{font-family:var(--f-texto);font-weight:400;font-size:.9375rem;color:var(--texto-2)}
.grupo-tema .linea-completa{margin:4px 0 14px 36px;color:var(--texto-2);font-size:.9375rem;max-width:80ch}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px}
.ticket{display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--superficie);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.talon{display:flex;flex-direction:column;align-items:center;padding:16px 6px;text-align:center;background:color-mix(in srgb,var(--eje) var(--mezcla),var(--superficie));border-right:2px dashed color-mix(in srgb,var(--eje) 70%,var(--oscurecer))}
.talon-dia{font-size:.8125rem;color:var(--texto-2)}
.talon-num{font-family:var(--f-titulo);font-size:2rem;font-weight:800;line-height:1;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.talon-mes{font-size:.875rem;font-weight:700}
.talon-mas{margin-top:10px;font-size:.75rem;line-height:1.2;color:var(--texto-2)}
.ticket-cuerpo{display:flex;flex-direction:column;gap:9px;padding:14px 16px;min-width:0}
.ticket-titulo{margin:0;font-size:1.0625rem;line-height:1.3}
.ticket-titulo .enlace-titulo{font-family:var(--f-titulo);font-weight:700}
.extracto{margin:0;font-size:.9375rem;color:var(--texto);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.extracto-lista{margin:0;padding:0;list-style:none;font-size:.9375rem}
.extracto-lista li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extracto-lista li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 9px 2px 2px;vertical-align:middle;background:color-mix(in srgb,var(--eje) 85%,var(--oscurecer))}
.extracto-lista li.mas{color:var(--texto-2);font-size:.875rem}
.extracto-lista li.mas::before{visibility:hidden}
.meta{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.875rem;color:var(--texto-2)}
.meta li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start}
.meta svg{margin-top:3px}
.ticket-pie{margin-top:auto;padding-top:11px;border-top:1px solid var(--linea);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}

/* Vista por fecha */
.semana + .semana{margin-top:34px}
.semana-titulo{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 6px;font-size:1.25rem}
.semana-titulo span{font-family:var(--f-texto);font-weight:400;font-size:.9375rem;color:var(--texto-2)}
.dia{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;padding:14px 0;border-top:1px solid var(--linea)}
.dia-fecha{margin:0;display:flex;flex-direction:column;line-height:1.1}
.dia-num{font-family:var(--f-titulo);font-size:2.125rem;font-weight:800;font-variant-numeric:tabular-nums}
.dia-nombre{font-weight:700;margin-top:2px}
.dia-mes{color:var(--texto-2);font-size:.875rem}
.marca-hoy{align-self:flex-start;font-size:.75rem;font-weight:700;background:var(--tinta);color:var(--superficie);border-radius:999px;padding:1px 8px;margin-bottom:4px}
.feriado-nota{margin:0;align-self:center;padding:12px 14px;border:1px dashed var(--linea);border-radius:10px;color:var(--texto-2)}
.filas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fila{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--superficie);border:1px solid var(--linea);border-left:6px solid color-mix(in srgb,var(--eje) 85%,var(--oscurecer));border-radius:10px;padding:12px 14px}
.fila-hora{margin:0;color:var(--texto-2);font-variant-numeric:tabular-nums;font-size:.9375rem}
.fila-hora b{color:var(--texto);font-size:1.0625rem}
.fila-info{min-width:0}
.fila-meta{margin:5px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px;font-size:.8125rem;color:var(--texto-2)}
.fila-meta .num-linea{width:18px;height:18px;font-size:.625rem}
.fila-accion{justify-self:end}

/* Vista por horario */
.grilla-scroll{overflow-x:auto;margin-top:8px}
.grilla{width:100%;min-width:780px;table-layout:fixed;border-collapse:separate;border-spacing:6px}
.grilla col.col-franja{width:104px}
.grilla thead th{text-align:left;font-size:.875rem;font-weight:700;padding:4px 6px;font-family:var(--f-texto)}
.grilla thead th small{margin-left:6px;font-size:.75rem;font-weight:700;background:var(--tinta);color:var(--superficie);border-radius:999px;padding:1px 7px}
.grilla thead th.feriado{color:var(--texto-2);font-style:italic}
.grilla thead th.pasado{color:var(--texto-2);font-weight:400}
.grilla tbody th{text-align:left;vertical-align:top;font-size:.875rem;padding:8px 4px;font-family:var(--f-texto)}
.grilla tbody th small{display:block;color:var(--texto-2);font-weight:400;font-size:.75rem}
.grilla td{padding:0;vertical-align:top;height:1px}
.grilla-celda{height:100%;min-height:96px;border-radius:10px;border:1px dashed var(--linea);display:flex;flex-direction:column;gap:6px}
.grilla-celda.llena{border:0}
.grilla td.hoy .grilla-celda{box-shadow:0 0 0 2px color-mix(in srgb,var(--tinta) 45%,transparent)}
.grilla-feriado{height:100%;min-height:300px;border-radius:10px;background:repeating-linear-gradient(135deg,var(--superficie-2) 0 10px,var(--superficie) 10px 20px);border:1px solid var(--linea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px;color:var(--texto-2)}
.grilla-feriado b{color:var(--texto);font-family:var(--f-titulo)}
.grilla-feriado span{font-size:.8125rem}
.bloque{position:relative;flex:1;display:flex;flex-direction:column;gap:5px;text-align:left;border-radius:10px;padding:10px 10px 10px 14px;color:var(--texto);
  background:color-mix(in srgb,var(--eje) var(--mezcla),var(--superficie));box-shadow:inset 5px 0 0 color-mix(in srgb,var(--eje) 85%,var(--oscurecer))}
.bloque:hover{background:color-mix(in srgb,var(--eje) calc(var(--mezcla) + 10%),var(--superficie))}
.bloque-hora{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--texto-2);font-variant-numeric:tabular-nums}
.bloque-hora .num-linea{width:17px;height:17px;font-size:.625rem}
.bloque-titulo{border:0;background:none;padding:0;margin:0;text-align:left;cursor:pointer;color:var(--texto);font-weight:700;font-size:.875rem;line-height:1.25}
.bloque-titulo .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bloque-titulo::after{content:"";position:absolute;inset:0;border-radius:10px}
.bloque-titulo:focus-visible{outline:none}
.bloque-titulo:focus-visible::after{outline:3px solid var(--foco);outline-offset:2px}
.bloque-meta{font-size:.75rem;color:var(--texto-2)}
.bloque .btn{position:relative;z-index:1;align-self:flex-start;margin-top:auto}
.bloque .nota-estado{margin-top:auto}
.btn-chico{padding:6px 11px;font-size:.8125rem;border-radius:7px;gap:6px}
.btn-chico svg{width:13px;height:13px}

/* Ficha del taller */
dialog{border:0;padding:0;width:100%;max-width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;border-radius:16px;background:var(--superficie);color:var(--texto);box-shadow:var(--sombra)}
dialog::backdrop{background:rgba(30,10,30,.6)}
.det-cab{position:relative;padding:22px 24px 16px;border-top:8px solid var(--eje)}
.det-cab h2{margin:10px 44px 8px 0;font-size:1.375rem;line-height:1.25}
.det-cab .linea-tag{flex-wrap:wrap}
.det-cab .linea-tag small{font-weight:400;font-size:.8125rem;flex-basis:100%;margin-left:28px}
.cerrar{position:absolute;top:12px;right:12px;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--texto)}
.cerrar:hover{background:var(--superficie-2)}
.cerrar svg{width:20px;height:20px}
.det-cuerpo{display:grid;gap:22px;padding:0 24px 6px}
.det-cuerpo h3{margin:0 0 8px;font-size:1rem}
.det-cuerpo p{margin:0 0 8px}
.det-lista{margin:0;padding-left:20px;display:grid;gap:4px}
.det-sesiones{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.det-sesiones li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 12px;border:1px solid var(--linea);border-radius:10px}
.det-sesiones b{display:block}
.det-sesiones span{color:var(--texto-2);font-size:.9375rem}
.det-sesiones a{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:700;text-underline-offset:3px}
.det-relatoria{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.det-relatoria b{display:block}
.det-relatoria span{color:var(--texto-2);font-size:.9375rem}
.det-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;margin-top:16px;padding:16px 24px 20px;border-top:1px solid var(--linea);position:sticky;bottom:0;background:var(--superficie)}

.pie{border-top:1px solid var(--linea);padding-block:22px 40px;color:var(--texto-2);font-size:.8125rem}
.pie p{margin:0 0 8px;max-width:100ch}

@media (max-width:760px){
  .grupos{grid-template-columns:1fr}
  .btn.boton-filtros{display:inline-flex}
  .grupos:not(.abierto){display:none}
  .pista-scroll{display:block}
  .dia{grid-template-columns:1fr;gap:8px}
  .dia-fecha{flex-direction:row;align-items:baseline;gap:8px}
  .dia-num{font-size:1.75rem}
  .marca-hoy{align-self:center;margin:0}
  .fila{grid-template-columns:1fr;gap:6px}
  .fila-accion{justify-self:start}
  .grupo-tema .linea-completa{margin-left:0}
}
@media (prefers-reduced-motion: no-preference){
  dialog[open]{animation:aparecer .16s ease-out}
  @keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

      return '<fieldset class="grupo grupo-' + g.id + '"><legend>' + g.nombre + '</legend><div class="chips">' + g.opciones.map(function (o) {
        return '<button type="button" class="chip" data-grupo="' + g.id + '" data-valor="' + esc(o.id) + '" aria-pressed="false">' +
          (o.linea ? numLinea(o.linea) : '') + '<span class="chip-nombre">' + esc(o.nombre) + '</span>' +
          (o.nota ? '<small>' + esc(o.nota) + '</small>' : '') + '<span class="cuenta"></span></button>';
      }).join('') + '</div></fieldset>';
    }).join('');
  }
  function actualizarFiltros() {
    $$('.chip').forEach(function (b) {
      var g = grupo(b.dataset.grupo), v = b.dataset.valor, on = state.sel[g.id].indexOf(v) >= 0;
      var n = TALLERES.filter(function (t) { return cumple(t, g.id) && g.test(t, v); }).length;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.querySelector('.cuenta').textContent = n;
      b.disabled = !on && n === 0;
      var nota = b.querySelector('small'), pre = g.id === 'linea' ? 'Línea ' + v + ', ' : '';
      b.setAttribute('aria-label', pre + b.querySelector('.chip-nombre').textContent + (nota ? ' ' + nota.textContent : '') + ', ' + plural(n, 'taller', 'talleres'));
    });
    $('#limpiar').hidden = !hayFiltros();
    var nf = nFiltros();
    $('#boton-filtros').textContent = nf ? 'Filtros (' + nf + ')' : 'Filtros';
  }
  function pintarConteo(lista) {
    var base = TALLERES.filter(function (t) { return estado(t).abierto; }).length, txt;
    if (!hayFiltros()) txt = plural(lista.length, 'taller', 'talleres') + ' con inscripciones abiertas';
    else txt = lista.length + ' de ' + plural(base, 'taller', 'talleres') + (lista.length === 1 ? ' coincide' : ' coinciden') + ' con tu búsqueda';
    $('#conteo').textContent = txt;
  }

  /* ---------- Vistas ---------- */
  function vacio() {
    if (!TALLERES.some(function (t) { return estado(t).abierto; })) {
      return '<div class="vacio"><p class="vacio-titulo">No hay talleres con inscripciones abiertas en esta fecha.</p><p>' +
        (state.ref > FIN_CICLO ? 'El ciclo terminó el ' + fechaLarga(FIN_CICLO) + '.' : 'Todos los talleres del ciclo ya comenzaron.') + '</p></div>';
    }
    return '<div class="vacio"><p class="vacio-titulo">Ningún taller coincide con la búsqueda y los filtros elegidos.</p><p>Quita algún filtro o prueba con otra palabra clave.</p>' +
      '<button type="button" class="btn btn-secundario" data-accion="limpiar">Limpiar filtros</button></div>';
  }
  function ticket(t) {
    var e = estado(t), s0 = t.sesiones[0], mas = t.sesiones.length - 1;
    return '<article class="ticket" style="' + estiloLinea(lin(t)) + '">' +
      '<div class="talon" aria-hidden="true"><span class="talon-dia">' + DIAS_C[s0.ini.getDay()] + '</span><span class="talon-num">' + s0.ini.getDate() +
      '</span><span class="talon-mes">' + MESES_C[s0.ini.getMonth()] + '</span>' + (mas ? '<span class="talon-mas">+' + plural(mas, 'sesión', 'sesiones') + '</span>' : '') + '</div>' +
      '<div class="ticket-cuerpo">' +
      '<h3 class="ticket-titulo"><button type="button" class="enlace-titulo" data-abrir="' + t.n + '">' + esc(t.titulo) + '</button></h3>' + extracto(t) +
      '<ul class="meta">' + lineasMeta(t).map(function (m) { return '<li>' + m[0] + '<span>' + esc(m[1]) + '</span></li>'; }).join('') + '</ul>' +
      '<div class="ticket-pie">' + estadoHTML(t, e) + '<div class="acciones"><button type="button" class="btn btn-secundario" data-abrir="' + t.n + '">Ver ficha<span class="sr-only"> de ' + esc(t.titulo) + '</span></button>' +
      botonInscripcion(t, e) + '</div></div></div></article>';
  }
  function vistaTema(lista) {
    return LINEAS.concat([SIN_LINEA]).map(function (l) {
      var items = lista.filter(function (t) { return t.linea === l.id; });
      if (!items.length) return '';
      return '<section class="grupo-tema" aria-labelledby="g-' + l.id + '"><h2 id="g-' + l.id + '">' + numLinea(l) + esc(l.corto) +
        '<span class="cuantos">' + plural(items.length, 'taller', 'talleres') + '</span></h2>' +
        (l.id ? '<p class="linea-completa">' + esc(l.nombre) + '</p>' : '<p class="linea-completa"></p>') +
        '<div class="tickets">' + items.map(ticket).join('') + '</div></section>';
    }).join('');
  }
  function rangoSemana(w) {
    var a = w.dias[0], b = w.dias[w.dias.length - 1];
    return a.getMonth() === b.getMonth() ? a.getDate() + ' al ' + b.getDate() + ' de ' + MESES[a.getMonth()] : a.getDate() + ' de ' + MESES[a.getMonth()] + ' al ' + b.getDate() + ' de ' + MESES[b.getMonth()];
  }
  function fila(x) {
    var t = x.t, s = x.s, e = estado(t), l = lin(t), accion;
    if (s.i === 0) accion = botonInscripcion(t, e) || '<span class="nota-estado">' + esc(e.etiqueta) + '</span>';
    else accion = '<span class="nota-estado">Continuación del taller</span>';
    return '<li class="fila" style="' + estiloLinea(l) + '">' +
      '<p class="fila-hora"><b>' + s.inicio + '</b> a ' + s.fin + '</p>' +
      '<div class="fila-info"><button type="button" class="enlace-titulo" data-abrir="' + t.n + '">' + esc(t.titulo) + '</button>' +
      '<p class="fila-meta">' + numLinea(l) + '<span>' + esc(l.corto) + '</span><span>' + textoSesion(t, s) + '</span><span>' + esc(t.modalidad) + '</span></p></div>' +
      '<div class="fila-accion">' + accion + '</div></li>';
  }
  function cabeceraDia(d) {
    var hoy = difDias(d, state.ref) === 0;
    return '<p class="dia-fecha">' + (hoy ? '<span class="marca-hoy">Hoy</span>' : '') + '<span class="dia-num">' + d.getDate() +
      '</span><span class="dia-nombre">' + DIAS[d.getDay()] + '</span><span class="dia-mes">' + MESES[d.getMonth()] + '</span></p>';
  }
  function vistaFecha(lista) {
    var visibles = {};
    lista.forEach(function (t) { visibles[t.n] = 1; });
    return SEMANAS.map(function (w) {
      var porDia = w.dias.map(function (d) { return TODAS.filter(function (x) { return visibles[x.t.n] && difDias(x.s.ini, d) === 0; }); });
      if (!porDia.some(function (xs) { return xs.length; })) return '';
      return '<section class="semana" aria-labelledby="sf-' + w.k + '"><h2 class="semana-titulo" id="sf-' + w.k + '">Semana ' + w.k + '<span>' + rangoSemana(w) + '</span></h2>' +
        porDia.map(function (xs, j) {
          var d = w.dias[j], fer = FERIADO[claveDia(d)];
          if (!xs.length && fer && d >= inicioDia(state.ref)) return '<div class="dia">' + cabeceraDia(d) + '<p class="feriado-nota">Feriado: ' + esc(fer) + '. No hay talleres este día.</p></div>';
          if (!xs.length) return '';
          return '<div class="dia">' + cabeceraDia(d) + '<ol class="filas">' + xs.map(fila).join('') + '</ol></div>';
        }).join('') + '</section>';
    }).join('');
  }
  function bloque(x) {
    var t = x.t, s = x.s, e = estado(t), l = lin(t);
    return '<div class="bloque" style="' + estiloLinea(l) + '">' +
      '<span class="bloque-hora">' + numLinea(l) + s.inicio + ' a ' + s.fin + '</span>' +
      '<button type="button" class="bloque-titulo" data-abrir="' + t.n + '"><span class="clamp">' + esc(t.titulo) + '</span></button>' +
      '<span class="bloque-meta">' + textoSesion(t, s) + ', ' + esc(t.modalidad.toLowerCase()) + '</span>' +
      botonInscripcion(t, e, true) + '</div>';
  }
  function vistaHorario(lista) {
    var visibles = {};
    lista.forEach(function (t) { visibles[t.n] = 1; });
    var celda = function (d, f) { return (CELDAS[claveDia(d) + '|' + f.id] || []).filter(function (x) { return visibles[x.t.n]; }); };
    return SEMANAS.map(function (w) {
      if (!w.dias.some(function (d) { return FRANJAS.some(function (f) { return celda(d, f).length; }); })) return '';
      var esFeriado = function (d) { return FERIADO[claveDia(d)] && !FRANJAS.some(function (f) { return (CELDAS[claveDia(d) + '|' + f.id] || []).length; }); };
      return '<section class="semana" aria-labelledby="sh-' + w.k + '"><h2 class="semana-titulo" id="sh-' + w.k + '">Semana ' + w.k + '<span>' + rangoSemana(w) + '</span></h2>' +
        '<div class="grilla-scroll"><table class="grilla"><caption class="sr-only">Sesiones de la semana ' + w.k + ' por día y jornada</caption>' +
        '<colgroup><col class="col-franja">' + w.dias.map(function () { return '<col>'; }).join('') + '</colgroup>' +
        '<thead><tr><td></td>' + w.dias.map(function (d) {
          var hoy = difDias(d, state.ref) === 0;
          var cls = [esFeriado(d) ? 'feriado' : '', d < inicioDia(state.ref) ? 'pasado' : ''].filter(Boolean).join(' ');
          return '<th scope="col"' + (cls ? ' class="' + cls + '"' : '') + '>' + capital(DIAS[d.getDay()]) + ' ' + d.getDate() + (hoy ? '<small>Hoy</small>' : '') + '</th>';
        }).join('') + '</tr></thead><tbody>' + FRANJAS.map(function (f, fi) {
          return '<tr><th scope="row">' + f.nombre + '<small>desde las ' + f.ref + '</small></th>' + w.dias.map(function (d) {
            var hoy = difDias(d, state.ref) === 0;
            if (esFeriado(d)) {
              return fi ? '' : '<td rowspan="' + FRANJAS.length + '"' + (hoy ? ' class="hoy"' : '') + '><div class="grilla-feriado"><b>Feriado</b><span>' + esc(FERIADO[claveDia(d)]) + '</span></div></td>';
            }
            var xs = celda(d, f);
            return '<td' + (hoy ? ' class="hoy"' : '') + '><div class="grilla-celda' + (xs.length ? ' llena' : '') + '">' + xs.map(bloque).join('') + '</div></td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div></section>';
    }).join('');
  }
  function pintarPanel(lista) {
    var p = $('#panel');
    if (!lista.length) { p.innerHTML = vacio(); return; }
    p.innerHTML = state.vista === 'fecha' ? vistaFecha(lista) : (state.vista === 'horario' ? vistaHorario(lista) : vistaTema(lista));
  }

  var dlg = $('#detalle'), origen = null, abierto = null;
  function render() {
    pintarTablero();
    actualizarFiltros();
    var lista = TALLERES.filter(function (t) { return cumple(t); });
    pintarConteo(lista);
    pintarPanel(lista);
    if (dlg.open && abierto != null) pintarDetalle(abierto);
  }

  /* ---------- Ficha del taller (misma estructura que el brochure) ---------- */
  function pintarDetalle(n) {
    var t = TALLERES.filter(function (x) { return x.n === n; })[0];
    if (!t) return;
    var e = estado(t), l = lin(t);
    var info = [];
    if (t.unidad) info.push('Taller liderado por ' + conArticulo(t.unidad) + '.');
    info.push(textoConsta(t));
    info.push('Se dictará en modalidad ' + t.modalidad.toLowerCase() + '. ' + (t.modalidad === 'Presencial' ? 'La sala se informa por correo a las personas inscritas.' : 'El enlace de conexión se envía por correo a las personas inscritas.'));
    info = info.concat(t.requerimientos);
    var trata = (t.descripcion ? '<p>' + esc(t.descripcion) + '</p>' : '') +
      (t.contenidos.length ? '<ul class="det-lista">' + t.contenidos.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '');
    dlg.setAttribute('style', estiloLinea(l));
    $('#det-contenido').innerHTML =
      '<div class="det-cab"><button type="button" class="cerrar" data-cerrar aria-label="Cerrar ficha">' + ICON.cerrar + '</button>' + etiquetaLinea(t, true) +
      '<h2 id="det-titulo">' + esc(t.titulo) + '</h2>' + estadoHTML(t, e) + '</div>' +
      '<div class="det-cuerpo">' +
      (trata ? '<section aria-labelledby="det-trata"><h3 id="det-trata">De qué trata el taller</h3>' + trata + '</section>' : '') +
      '<section aria-labelledby="det-info"><h3 id="det-info">Información general y requerimientos</h3><ul class="det-lista">' +
        info.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>' +
      '<section aria-labelledby="det-ses"><h3 id="det-ses">Fechas y horarios</h3><ol class="det-sesiones">' +
      t.sesiones.map(function (s) {
        return '<li><div><b>' + capital(fechaLarga(s.ini)) + '</b><span>' + s.inicio + ' a ' + s.fin + ', ' + horas(s.min) + (t.sesiones.length > 1 ? '. ' + textoSesion(t, s) : '') + '</span></div>' +
          '<a href="' + esc(enlaceCalendario(t, s)) + '" target="_blank" rel="noopener noreferrer">' + ICON.cal + 'Añadir a Google Calendar<span class="sr-only"> (se abre en otra pestaña)</span></a></li>';
      }).join('') + '</ol></section>' +
      (t.relatores.length ? '<section aria-labelledby="det-rel"><h3 id="det-rel">' + (t.relatores.length === 1 ? 'Relator/a' : 'Relatores/as') + '</h3><ul class="det-relatoria">' +
        t.relatores.map(function (r) { return '<li><b>' + esc(r.nombre) + '</b>' + (r.resena ? '<span>' + esc(r.resena) + '</span>' : '') + '</li>'; }).join('') + '</ul></section>' : '') +
      '</div><div class="det-pie"><button type="button" class="btn btn-secundario" data-cerrar>Volver a la oferta</button>' +
      (botonInscripcion(t, e) || '<span class="nota-estado">' + esc(e.etiqueta) + '</span>') + '</div>';
  }
  function abrirDetalle(n, desde) {
    ocultarTip();
    origen = desde || document.activeElement;
    abierto = n;
    pintarDetalle(n);
    if (!dlg.open) dlg.showModal();
    if (window.OT_CONTEXTO === 'h5p') {
      // Dentro de H5P el marco crece con el contenido: la ficha se abre junto al elemento elegido, no al centro del marco.
      var r = origen && origen.getBoundingClientRect ? origen.getBoundingClientRect() : { top: 0 };
      var total = document.documentElement.scrollHeight, alto = dlg.offsetHeight;
      var y = Math.max(12, Math.min(r.top + window.scrollY - 40, total - alto - 12));
      dlg.style.position = 'absolute'; dlg.style.top = y + 'px'; dlg.style.bottom = 'auto'; dlg.style.margin = '0 auto';
    }
    var c = $('#det-contenido .cerrar'); if (c) c.focus();
  }
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg || ev.target.closest('[data-cerrar]')) dlg.close(); });
  dlg.addEventListener('close', function () { abierto = null; if (origen && origen.isConnected) origen.focus(); });

  /* ---------- Tooltip del calendario ---------- */
  var tip = $('#tip');
  function mostrarTip(f) {
    var t = TALLERES.filter(function (x) { return x.n === +f.dataset.abrir; })[0];
    if (!t) return;
    var s = t.sesiones[+f.dataset.s], e = estado(t), l = lin(t);
    tip.innerHTML = '<b>' + capital(fechaCorta(s.ini)) + ', ' + s.inicio + ' a ' + s.fin + '</b><span>' + esc(t.titulo) + '</span><small>' +
      (l.id ? 'Línea ' + l.id + ', ' + esc(l.corto) + '. ' : '') + textoSesion(t, s) + ', ' + esc(t.modalidad.toLowerCase()) + '. ' + esc(e.etiqueta) + '.</small>';
    tip.hidden = false;
    var r = f.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
    var y = r.top - th - 10;
    if (y < 8) y = r.bottom + 10;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  function ocultarTip() { tip.hidden = true; }
  var tab = $('#tablero');
  tab.addEventListener('pointerover', function (ev) { var f = ev.target.closest('.ficha'); if (f) mostrarTip(f); });
  tab.addEventListener('pointerout', function (ev) { if (ev.target.closest('.ficha')) ocultarTip(); });
  tab.addEventListener('focusin', function (ev) { var f = ev.target.closest('.ficha'); if (f) mostrarTip(f); });
  tab.addEventListener('focusout', ocultarTip);
  window.addEventListener('scroll', ocultarTip, { passive: true });
  document.body.addEventListener('scroll', ocultarTip, { passive: true });
  $('.tablero-scroll').addEventListener('scroll', ocultarTip, { passive: true });

  /* ---------- Eventos ---------- */
  function limpiar() {
    state.q = ''; $('#q').value = '';
    GRUPOS.forEach(function (g) { state.sel[g.id] = []; });
    render();
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('[data-abrir]');
    if (a && !dlg.contains(a)) { abrirDetalle(+a.dataset.abrir, a); return; }
    var acc = ev.target.closest('[data-accion]');
    if (acc && acc.dataset.accion === 'limpiar') limpiar();
  });
  $('#grupos').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip');
    if (!b || b.disabled) return;
    var arr = state.sel[b.dataset.grupo], v = b.dataset.valor, j = arr.indexOf(v);
    if (j >= 0) arr.splice(j, 1); else arr.push(v);
    render();
  });
  $('#q').addEventListener('input', function (ev) { state.q = ev.target.value; render(); });
  $('#limpiar').addEventListener('click', limpiar);
  var chkInscritos = $('#ver-inscritos');
  if (chkInscritos) chkInscritos.addEventListener('change', function (ev) { state.verInscritos = ev.target.checked; render(); });
  $('#boton-filtros').addEventListener('click', function () {
    var abiertoF = $('#grupos').classList.toggle('abierto');
    this.setAttribute('aria-expanded', abiertoF ? 'true' : 'false');
  });

  function setVista(v, foco) {
    state.vista = v;
    $$('[role="tab"]').forEach(function (t) {
      var on = t.dataset.vista === v;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (on && foco) t.focus();
    });
    $('#panel').setAttribute('aria-labelledby', 'tab-' + v);
    render();
  }
  $$('[role="tab"]').forEach(function (t) { t.addEventListener('click', function () { setVista(t.dataset.vista); }); });
  $('.vistas').addEventListener('keydown', function (ev) {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(ev.key) < 0) return;
    var tabs = $$('[role="tab"]'), j = tabs.indexOf(document.activeElement);
    if (j < 0) j = tabs.map(function (t) { return t.getAttribute('aria-selected'); }).indexOf('true');
    j = ev.key === 'Home' ? 0 : ev.key === 'End' ? tabs.length - 1 : (j + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    ev.preventDefault();
    setVista(tabs[j].dataset.vista, true);
  });

  /* ---------- Barra de prototipo (se elimina al publicar) ---------- */
  if (PUB) {
    $('.proto').remove();
    state.verInscritos = DATA.publicacion.inscritos === 'cifra';
    state.ref = new Date();
    pintarCabecera(); construirFiltros(); render();
    return;
  }
  var inputFecha = $('#ref-fecha');
  $('#proto-rapidos').innerHTML = PRESETS.map(function (p) {
    var d = parseFecha(p.fecha, '09:00');
    return '<button type="button" data-fecha="' + p.fecha + '" aria-pressed="false">' + p.etiqueta + ' (' + d.getDate() + ' ' + MESES_C[d.getMonth()] + ')</button>';
  }).join('');
  function setRef(iso) {
    state.ref = parseFecha(iso, '09:00');
    inputFecha.value = iso;
    $$('#proto-rapidos button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.fecha === iso ? 'true' : 'false'); });
    render();
  }
  $('#proto-rapidos').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) setRef(b.dataset.fecha); });
  inputFecha.addEventListener('change', function () { if (inputFecha.value) setRef(inputFecha.value); });

  pintarCabecera();
  construirFiltros();
  setRef(PRESETS[0].fecha);
})();
</script>
</body>
</html>
